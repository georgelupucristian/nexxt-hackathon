# CI for the Kip app (app/): typecheck, unit tests, production build, then the Playwright e2e suite
# on the phone project against the built app served by `vite preview`.
#
# No secrets are needed. Without VITE_SUPABASE_* the app runs on its local demo account, which is
# what the e2e suite drives ("Încearcă cu date demo" on /welcome).

name: CI

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Production build
        run: npm run build

      # The e2e job serves exactly this build instead of building again.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (phone, production build)
    needs: check
    runs-on: ubuntu-latest
    # ~15 tests one at a time on software WebGL: about 6 minutes on a laptop, allow for a slow runner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist

      # Browsers are cached per Playwright version; the OS libraries are installed every time
      # because the runner image is fresh.
      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system libraries (Chromium from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Runners have no GPU: Kip's WebGL2 renders through ANGLE + SwiftShader. Fail fast with a
      # clear message if that is missing, instead of as a pile of e2e timeouts.
      - name: Check WebGL2 in headless Chromium
        run: node scripts/webgl-check.mjs

      # scripts/playwright.ci.config.ts reuses playwright.config.ts (projects, WebGL flags,
      # ro-RO locale, Europe/Bucharest timezone), serves dist/ with `vite preview` on :4173,
      # runs one browser at a time with longer timeouts and 2 retries.
      - name: E2E tests (phone)
        run: npx playwright test -c scripts/playwright.ci.config.ts --project=phone

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/e2e/.report
            app/e2e/.results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
